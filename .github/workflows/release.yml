# Release workflow: build, publish to PyPI, create a GitHub Release.
#
# Triggered by pushing a tag like v0.3.0. Publishing uses PyPI Trusted
# Publishing (OIDC), so NO PyPI API token secret is required.
#
# One-time setup on PyPI (per project):
#   Publishing -> Add a pending publisher:
#     owner:  <repo owner>
#     repository: zameen.com-mcp
#     workflow: release.yml
#     environment: pypi
# The GitHub repository must also have an environment named `pypi`
# (Settings -> Environments). Restricting that environment to the main
# branch / v* tags is recommended.

name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(python - <<'PY'
          import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          PY
          )
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package version $PKG_VERSION"
            exit 1
          fi

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Build distributions
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI and create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing: mint short-lived OIDC tokens for PyPI upload.
      id-token: write
      # Needed to create the GitHub Release and attach artifacts.
      contents: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` on purpose — authentication is OIDC-based.

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
